<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked cards</title>
<style>
  :root {
    --bg: #070a10;
    --card-w: 560px;
    --card-h: 490px;
    --persp: 1600px;
    --horizon: 3200px;   /* how far ABOVE the cards the "camera" sits */
    --count: 5;

    /* Spacing between layers (x = right, y = up, z = depth) */
    --step-x: 76px;
    --step-y: 12px;
    --step-z: -15px;

    /* Stack orientation (JS updates the tilt vars on pointer move) */
    --rot-y: -3.5deg;
    --rot-x: 0deg;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    overflow: hidden;
  }

  /* Perspective lives on the parent of the 3D scene */
  .stage {
    width: min(100vw, 1100px);
    height: min(80vh, 700px);
    display: grid;
    place-items: center;
    perspective: var(--persp);
    /* Camera high above the cards: the top and bottom edges both slope
       downward to the right while the left/right edges stay vertical. */
    perspective-origin: 50% calc(50% - var(--horizon));
  }

  /* The whole stack rotates as one object */
  .stack {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    transform-style: preserve-3d;
    transform: translateX(-12%) rotateX(var(--rot-x)) rotateY(var(--rot-y));
    transition: transform 0.25s ease-out;
  }

  .card {
    position: absolute;
    inset: 0;
    border-radius: 34px;
    /* --i is the layer index: 0 = front card */
    transform: translate3d(
      calc(var(--i) * var(--step-x)),
      calc(var(--i) * var(--step-y)),
      calc(var(--i) * var(--step-z))
    );
    background: linear-gradient(145deg, var(--c-light), var(--c-dark));
    /* Soft top highlight + thick glassy edge + depth shadow */
    box-shadow:
      inset 0 2px 1px rgba(255, 255, 255, 0.55),
      inset 0 -10px 24px rgba(0, 20, 80, 0.25),
      0 30px 60px rgba(0, 0, 0, 0.45);
    transition: transform 0.5s cubic-bezier(.2, .8, .2, 1);
  }

  /* Glossy sheen */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(120deg, rgba(255,255,255,.28), transparent 45%);
    pointer-events: none;
  }

  /* Fan the layers out a bit on hover */
  .stack:hover { --step-x: 94px; --step-y: 8px; --step-z: -25px; }

  @media (max-width: 760px) {
    :root { --card-w: 300px; --card-h: 262px; --persp: 900px; --horizon: 1800px; --step-x: 40px; --step-y: 7px; --step-z: -8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stack, .card { transition: none; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="stack" id="stack"></div>
  </div>

<script>
  const COUNT = 5;
  const stack = document.getElementById('stack');
  const stage = document.getElementById('stage');

  // Build the cards. Color blends from teal (front) to deep blue (back).
  for (let i = 0; i < COUNT; i++) {
    const t = i / (COUNT - 1);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--i', i);
    const alpha = 0.95 - t * 0.2;   // front card 0.95 → back card 0.75
    card.style.setProperty('--c-light', `hsl(${172 + t * 48} 85% ${72 - t * 16}% / ${alpha})`);
    card.style.setProperty('--c-dark',  `hsl(${180 + t * 42} 80% ${56 - t * 18}% / ${alpha})`);
    stack.appendChild(card);
  }

  // Subtle tilt that follows the pointer
  const BASE_Y = -3.5, BASE_X = 0, RANGE = 3;
  stage.addEventListener('pointermove', (e) => {
    const r = stage.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - 0.5;   // -0.5 .. 0.5
    const ny = (e.clientY - r.top) / r.height - 0.5;
    stack.style.setProperty('--rot-y', `${BASE_Y + nx * RANGE}deg`);
    stack.style.setProperty('--rot-x', `${BASE_X - ny * RANGE}deg`);
  });
  stage.addEventListener('pointerleave', () => {
    stack.style.setProperty('--rot-y', `${BASE_Y}deg`);
    stack.style.setProperty('--rot-x', `${BASE_X}deg`);
  });
</script>
</body>
</html>
